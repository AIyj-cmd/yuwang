<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小组 — 电台调频</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&family=Noto+Sans+SC:wght@400;700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: #2a2a35;
      min-height: 100vh; color: #e0e0e0; padding: 40px 20px;
    }
    .radio { max-width: 1000px; margin: 0 auto; }

    .receiver {
      background: #3a3a45; border: 6px solid #1a1a25; border-radius: 16px;
      padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.3);
      position: relative;
    }
    .receiver::before {
      content:''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 80px; height: 6px; background: #1a1a25; border-radius: 3px;
    }

    .freq-display {
      background: #1a1a25; border: 4px solid #555; border-radius: 8px; padding: 16px 24px;
      text-align: center; margin-bottom: 24px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }
    .freq-display .band {
      font-family: 'VT323', monospace; font-size: 3rem; color: #ff6b35;
      text-shadow: 0 0 10px rgba(255,107,53,0.4); letter-spacing: 0.1em;
    }
    .freq-display .station-name {
      font-family: 'VT323', monospace; font-size: 1.2rem; color: #4ecdc4; margin-top: 4px;
    }
    .freq-display .signal-bar {
      display: flex; gap: 4px; justify-content: center; margin-top: 10px;
    }
    .freq-display .signal-bar span {
      width: 8px; background: #333; border-radius: 2px;
    }
    .freq-display .signal-bar span.on { background: #4ecdc4; }
    .freq-display .signal-bar span.on.high { background: #ff6b35; }

    /* 频道旋钮区 */
    .dial-section {
      display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px;
    }
    @media (max-width: 768px) { .dial-section { grid-template-columns: 1fr; } }
    .dial-panel {
      background: #2a2a35; border: 3px solid #444; border-radius: 12px; padding: 20px;
    }
    .dial-panel h3 {
      font-family: 'VT323', monospace; font-size: 1rem; color: #888; text-transform: uppercase;
      letter-spacing: 0.1em; margin-bottom: 14px;
    }

    .station-list { display: flex; flex-direction: column; gap: 8px; }
    .station-btn {
      display: flex; align-items: center; gap: 12px;
      background: #222; border: 2px solid #444; padding: 12px 16px; cursor: pointer;
      transition: all 0.15s; text-align: left; color: inherit; font-family: inherit;
    }
    .station-btn:hover { border-color: #ff6b35; background: #2a2a35; }
    .station-btn.active { border-color: #4ecdc4; background: #1a2a2a; }
    .station-btn .freq-num {
      font-family: 'VT323', monospace; font-size: 1.3rem; color: #ff6b35; width: 60px;
    }
    .station-btn .freq-info { flex: 1; }
    .station-btn .freq-info strong { font-size: 0.9rem; display: block; }
    .station-btn .freq-info span { font-size: 0.75rem; color: #888; }
    .station-btn .signal-dots { display: flex; gap: 3px; }
    .station-btn .signal-dots i { width: 6px; height: 6px; border-radius: 50%; background: #333; }
    .station-btn .signal-dots i.on { background: #4ecdc4; }

    /* 可视化条 */
    .viz-bars {
      display: flex; align-items: flex-end; justify-content: center; gap: 3px;
      height: 60px; margin: 16px 0;
    }
    .viz-bars span {
      width: 8px; background: #4ecdc4; border-radius: 2px; opacity: 0.6;
      animation: viz 0.5s ease-in-out infinite alternate;
    }
    @keyframes viz { from { opacity: 0.3; } to { opacity: 1; } }

    /* 磁带区 */
    .cassette-area {
      background: #222; border: 4px solid #444; border-radius: 8px; padding: 20px;
      margin-top: 20px;
    }
    .cassette {
      background: #3a3a45; border: 3px solid #555; border-radius: 8px;
      padding: 16px; display: grid; grid-template-columns: 80px 1fr; gap: 16px; align-items: center;
    }
    .cassette .reel {
      width: 60px; height: 60px; border: 4px solid #555; border-radius: 50%;
      position: relative; animation: spin 3s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .cassette .reel::before, .cassette .reel::after {
      content:''; position: absolute; background: #555; border-radius: 50%;
    }
    .cassette .reel::before { width: 20px; height: 20px; top: 50%; left: 50%; transform: translate(-50%,-50%); }
    .cassette .reel::after { width: 8px; height: 8px; top: 20%; left: 20%; }
    .cassette .track-info h4 { font-family: 'VT323', monospace; font-size: 1.1rem; color: #ff6b35; }
    .cassette .track-info p { font-size: 0.8rem; color: #888; margin-top: 4px; }
    .cassette .track-info .progress-track { height: 8px; background: #1a1a25; margin-top: 10px; border-radius: 4px; overflow: hidden; }
    .cassette .track-info .progress-track .fill { height: 100%; width: 60%; background: #4ecdc4; border-radius: 4px; }

    /* 控制按钮 */
    .controls {
      display: flex; gap: 12px; margin-top: 16px; justify-content: center;
    }
    .ctrl-btn {
      width: 50px; height: 50px; border-radius: 50%; background: #444; border: 3px solid #555;
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
      cursor: pointer; color: #fff; transition: all 0.1s;
    }
    .ctrl-btn:hover { background: #555; }
    .ctrl-btn.rec { background: #c0392b; border-color: #e74c3c; }

    /* 底部操作 */
    .broadcast-station {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 24px;
    }
    @media (max-width: 768px) { .broadcast-station { grid-template-columns: 1fr; } }
    .broadcast-box {
      background: #3a3a45; border: 3px solid #444; border-radius: 12px; padding: 20px;
    }
    .broadcast-box h4 {
      font-family: 'VT323', monospace; font-size: 1rem; color: #ff6b35; margin-bottom: 12px;
    }
    .broadcast-box input, .broadcast-box textarea, .broadcast-box select {
      width: 100%; background: #1a1a25; border: 2px solid #444; padding: 10px;
      color: #e0e0e0; font-family: inherit; font-size: 0.9rem; margin-bottom: 10px; outline: none; border-radius: 6px;
    }
    .broadcast-box button {
      background: #4ecdc4; color: #1a1a25; border: none; padding: 10px 20px;
      font-weight: 700; cursor: pointer; border-radius: 6px;
    }
    .broadcast-box button:hover { background: #fff; }
  </style>
</head>
<body>
  <div class="radio">
    <div class="receiver">
      <div class="freq-display">
        <div class="band">FM 88.8</div>
        <div class="station-name">地下茶水间 Radio</div>
        <div class="signal-bar">
          <span class="on high"></span><span class="on high"></span><span class="on high"></span>
          <span class="on"></span><span class="on"></span><span></span><span></span>
        </div>
      </div>

      <div class="dial-section">
        <div class="dial-panel">
          <h3>📻 预设频道</h3>
          <div class="station-list">
            <button class="station-btn active">
              <span class="freq-num">88.8</span>
              <div class="freq-info"><strong>地下茶水间</strong><span>34 成员 · 892 记录 · 公开</span></div>
              <div class="signal-dots"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>
            </button>
            <button class="station-btn">
              <span class="freq-num">92.5</span>
              <div class="freq-info"><strong>带薪发呆互助会</strong><span>18 成员 · 445 记录 · 邀请制</span></div>
              <div class="signal-dots"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
            </button>
            <button class="station-btn">
              <span class="freq-num">96.2</span>
              <div class="freq-info"><strong>会议室占领联盟</strong><span>56 成员 · 1.2k 记录 · 公开</span></div>
              <div class="signal-dots"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>
            </button>
            <button class="station-btn">
              <span class="freq-num">101.0</span>
              <div class="freq-info"><strong>假装很忙演技派</strong><span>7 成员 · 67 记录 · 邀请制</span></div>
              <div class="signal-dots"><i class="on"></i><i class="on"></i><i></i><i></i></div>
            </button>
            <button class="station-btn">
              <span class="freq-num">105.7</span>
              <div class="freq-info"><strong>卫生间读报协会</strong><span>12 成员 · 198 记录 · 邀请制</span></div>
              <div class="signal-dots"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
            </button>
          </div>
        </div>
        <div class="dial-panel">
          <h3>🎵 正在播放</h3>
          <div class="viz-bars">
            <span style="height:20%;animation-delay:0s"></span>
            <span style="height:40%;animation-delay:0.1s"></span>
            <span style="height:60%;animation-delay:0.2s"></span>
            <span style="height:80%;animation-delay:0.3s"></span>
            <span style="height:50%;animation-delay:0.15s"></span>
            <span style="height:70%;animation-delay:0.25s"></span>
            <span style="height:30%;animation-delay:0.05s"></span>
            <span style="height:90%;animation-delay:0.35s"></span>
            <span style="height:45%;animation-delay:0.2s"></span>
            <span style="height:65%;animation-delay:0.1s"></span>
            <span style="height:25%;animation-delay:0.3s"></span>
            <span style="height:55%;animation-delay:0.15s"></span>
          </div>

          <div class="cassette-area">
            <div class="cassette">
              <div class="reel"></div>
              <div class="track-info">
                <h4>本周目标：假装开会</h4>
                <p>进度 12/20 · 达成奖励 50 鱼鳞</p>
                <div class="progress-track"><div class="fill"></div></div>
              </div>
            </div>
            <div class="controls">
              <button class="ctrl-btn">⏮</button>
              <button class="ctrl-btn">⏸</button>
              <button class="ctrl-btn">⏭</button>
              <button class="ctrl-btn rec">●</button>
            </div>
          </div>

          <div style="margin-top:20px;">
            <h3 style="font-family:'VT323',monospace;font-size:1rem;color:#888;margin-bottom:10px;">RECENT TRACKS</h3>
            <div style="font-size:0.85rem;line-height:1.8;color:#aaa;">
              <div>▶ 匿名鱼_A — 假装在写周报 · 86.4</div>
              <div>▶ 摸鱼专家_B — 带了笔记本没插电 · 72.0</div>
              <div>▶ 工位幽灵_C — 接水接了八百米 · 54.6</div>
              <div>▶ 键盘演奏家_D — 带了一整章小说 · 91.2</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="broadcast-station">
      <div class="broadcast-box">
        <h4>📡 调频加入</h4>
        <input type="text" placeholder="输入邀请码频率" />
        <button>锁定频道</button>
        <p style="font-size:0.8rem;color:#888;margin-top:8px;">仅保存邀请码，不收集真实身份。</p>
      </div>
      <div class="broadcast-box">
        <h4>🎙️ 开设电台</h4>
        <input type="text" placeholder="电台名称" />
        <textarea rows="2" placeholder="电台简介"></textarea>
        <select><option>公开频段</option><option>加密频段</option></select>
        <button>开播 · 50 鱼鳞</button>
      </div>
    </div>
  </div>
</body>
</html>
