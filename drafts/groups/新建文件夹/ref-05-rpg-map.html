<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小组 — RPG世界地图</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+SC:wght@400;700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: #1a472a;
      background-image:
        repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, transparent 1px, transparent 20px, rgba(0,0,0,0.1) 21px),
        repeating-linear-gradient(90deg, rgba(0,0,0,0.1) 0px, transparent 1px, transparent 20px, rgba(0,0,0,0.1) 21px);
      min-height: 100vh; color: #fff;
    }
    .map-page { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }

    .map-header {
      text-align: center; margin-bottom: 30px;
    }
    .map-header h1 {
      font-family: 'Press Start 2P', cursive; font-size: 1.6rem; color: #ffeb3b;
      text-shadow: 3px 3px 0 #000; line-height: 1.6;
    }
    .map-header .world-stats {
      display: inline-flex; gap: 24px; margin-top: 16px;
      background: rgba(0,0,0,0.5); border: 4px solid #fff; padding: 10px 24px;
      font-family: 'Press Start 2P', cursive; font-size: 0.6rem;
    }

    /* 地图画布 */
    .world-map {
      position: relative; width: 100%; aspect-ratio: 16/10;
      background: #2e7d32;
      border: 6px solid #5d4037;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    /* 地形装饰 */
    .world-map::before {
      content:''; position: absolute; width: 200px; height: 200px;
      background: #388e3c; border-radius: 50%; top: 10%; left: 15%; opacity: 0.6;
    }
    .world-map::after {
      content:''; position: absolute; width: 300px; height: 150px;
      background: #1b5e20; border-radius: 50%; bottom: 20%; right: 10%; opacity: 0.5;
    }
    .terrain-mtn {
      position: absolute; width: 0; height: 0;
      border-left: 30px solid transparent; border-right: 30px solid transparent;
      border-bottom: 50px solid #4e342e;
    }
    .terrain-water {
      position: absolute; background: #0277bd; border-radius: 50%; opacity: 0.7;
    }

    /* 据点节点 */
    .node {
      position: absolute; width: 64px; height: 64px;
      background: #ffeb3b; border: 4px solid #000; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 1.8rem;
      cursor: pointer; z-index: 5; box-shadow: 4px 4px 0 rgba(0,0,0,0.4);
      transition: all 0.15s;
    }
    .node:hover { transform: scale(1.2); }
    .node.active { background: #ff5252; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,82,82,0.7)} 50%{box-shadow:0 0 0 15px rgba(255,82,82,0)} }
    .node .label {
      position: absolute; bottom: -28px; white-space: nowrap;
      background: #000; color: #fff; padding: 3px 10px; font-size: 0.65rem;
      font-family: 'Press Start 2P', cursive; border: 2px solid #fff;
    }

    /* 路径 */
    .path-line {
      position: absolute; height: 4px; background: #8d6e63; z-index: 1;
      transform-origin: left center;
    }
    .path-line::after {
      content:''; position: absolute; right: -6px; top: -4px;
      width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 10px solid #8d6e63;
    }

    /* 信息面板 - 像RPG对话框 */
    .rpg-dialog {
      background: #000; border: 6px solid #fff; padding: 24px; margin-top: 24px;
      box-shadow: 8px 8px 0 rgba(0,0,0,0.4); position: relative;
    }
    .rpg-dialog::before {
      content: '▼'; position: absolute; bottom: 12px; right: 16px;
      color: #fff; font-family: 'Press Start 2P', cursive; font-size: 0.7rem;
      animation: bounce 1s infinite;
    }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(4px)} }
    .dialog-grid { display: grid; grid-template-columns: 140px 1fr; gap: 20px; }
    @media (max-width: 768px) { .dialog-grid { grid-template-columns: 1fr; } }
    .dialog-avatar {
      width: 120px; height: 120px; background: #333; border: 4px solid #fff;
      display: flex; align-items: center; justify-content: center; font-size: 3rem;
    }
    .dialog-text h2 { font-family: 'Press Start 2P', cursive; font-size: 0.85rem; color: #ffeb3b; margin-bottom: 12px; line-height: 1.5; }
    .dialog-text p { font-size: 0.9rem; line-height: 1.7; color: #ccc; margin-bottom: 8px; }
    .dialog-text .choice {
      display: block; background: #222; border: 3px solid #555; padding: 10px 16px;
      margin: 8px 0; cursor: pointer; font-size: 0.85rem; color: #fff;
      transition: all 0.1s;
    }
    .dialog-text .choice:hover { border-color: #ffeb3b; color: #ffeb3b; background: #1a1a1a; }
    .dialog-text .choice::before { content: '▶ '; color: #555; }
    .dialog-text .choice:hover::before { content: '▶ '; color: #ffeb3b; }

    /* 底部状态栏 */
    .party-bar {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 24px;
    }
    @media (max-width: 768px) { .party-bar { grid-template-columns: 1fr 1fr; } }
    .party-member {
      background: #000; border: 4px solid #fff; padding: 14px;
      display: flex; align-items: center; gap: 12px;
    }
    .party-member .face { width: 40px; height: 40px; background: #333; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
    .party-member .info { font-size: 0.75rem; }
    .party-member .info strong { display: block; color: #ffeb3b; font-size: 0.8rem; margin-bottom: 4px; }
    .hp-mini { height: 6px; background: #333; margin-top: 4px; }
    .hp-mini i { display: block; height: 100%; background: #4caf50; }

    .action-palette {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px;
    }
    .action-palette > div {
      background: #000; border: 4px solid #fff; padding: 20px;
    }
    .action-palette h3 { font-family: 'Press Start 2P', cursive; font-size: 0.7rem; color: #ffeb3b; margin-bottom: 12px; }
    .action-palette input, .action-palette textarea, .action-palette select {
      width: 100%; background: #111; border: 3px solid #444; padding: 10px; color: #fff;
      font-family: inherit; font-size: 0.9rem; margin-bottom: 10px; outline: none;
    }
    .action-palette button {
      background: #ffeb3b; border: 3px solid #fff; color: #000; padding: 10px 18px;
      font-family: 'Press Start 2P', cursive; font-size: 0.6rem; cursor: pointer; box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
    }
    .action-palette button:hover { background: #fff; }
  </style>
</head>
<body>
  <div class="map-page">
    <div class="map-header">
      <h1>WORLD MAP</h1>
      <div class="world-stats">
        <span>GRP:5</span>
        <span>REC:127</span>
        <span>LV:42</span>
      </div>
    </div>

    <div class="world-map">
      <div class="terrain-mtn" style="top:15%;left:60%"></div>
      <div class="terrain-mtn" style="top:25%;left:65%;transform:scale(0.8)"></div>
      <div class="terrain-water" style="width:120px;height:80px;top:50%;left:20%"></div>
      <div class="terrain-water" style="width:80px;height:60px;top:60%;left:75%"></div>

      <!-- 路径 -->
      <div class="path-line" style="width:180px;top:35%;left:12%;transform:rotate(15deg)"></div>
      <div class="path-line" style="width:140px;top:45%;left:30%;transform:rotate(-20deg)"></div>
      <div class="path-line" style="width:200px;top:38%;left:42%;transform:rotate(8deg)"></div>
      <div class="path-line" style="width:120px;top:55%;left:55%;transform:rotate(-35deg)"></div>

      <!-- 据点 -->
      <div class="node active" style="top:30%;left:8%">
        🍵
        <span class="label">茶水间</span>
      </div>
      <div class="node" style="top:40%;left:28%">
        😶
        <span class="label">发呆会</span>
      </div>
      <div class="node" style="top:35%;left:50%">
        🚪
        <span class="label">会议室</span>
      </div>
      <div class="node" style="top:55%;left:42%">
        🎭
        <span class="label">演技派</span>
      </div>
      <div class="node" style="top:50%;left:70%">
        📰
        <span class="label">读报协会</span>
      </div>
    </div>

    <div class="rpg-dialog">
      <div class="dialog-grid">
        <div class="dialog-avatar">🍵</div>
        <div class="dialog-text">
          <h2>地下茶水间 据点详情</h2>
          <p>「本周协作目标：假装开会。进度 12/20，还差 8 条记录即可全员获得 50 鱼鳞。」</p>
          <p>「匿名化是强制的。你的每一次记录都会为据点贡献火力值。」</p>
          <div style="margin-top:12px;">
            <span class="choice">发起挑战：假装开会（消耗 30 鱼鳞）</span>
            <span class="choice">发起挑战：走廊漫游（消耗 30 鱼鳞）</span>
            <span class="choice">查看成员名单</span>
            <span class="choice">查看记录流</span>
          </div>
        </div>
      </div>
    </div>

    <div class="party-bar">
      <div class="party-member">
        <div class="face">🐟</div>
        <div class="info"><strong>匿名鱼_A</strong>HP<div class="hp-mini"><i style="width:86%"></i></div></div>
      </div>
      <div class="party-member">
        <div class="face">😎</div>
        <div class="info"><strong>摸鱼专家_B</strong>HP<div class="hp-mini"><i style="width:72%"></i></div></div>
      </div>
      <div class="party-member">
        <div class="face">👻</div>
        <div class="info"><strong>工位幽灵_C</strong>HP<div class="hp-mini"><i style="width:54%"></i></div></div>
      </div>
      <div class="party-member">
        <div class="face">🎹</div>
        <div class="info"><strong>键盘演奏_D</strong>HP<div class="hp-mini"><i style="width:91%"></i></div></div>
      </div>
    </div>

    <div class="action-palette">
      <div>
        <h3>JOIN WITH CODE</h3>
        <input type="text" placeholder="X7K9M2" />
        <button>JOIN GROUP</button>
      </div>
      <div>
        <h3>CREATE CAMP</h3>
        <input type="text" placeholder="据点名称" />
        <textarea rows="2" placeholder="据点公告"></textarea>
        <select><option>公开据点</option><option>邀请码据点</option></select>
        <button>CREATE · 50</button>
      </div>
    </div>
  </div>
</body>
</html>
